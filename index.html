<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The-Pose-Shuffler</title>
    <style>
        :root {
            --ui-text: #f3f3f3;
            --ui-muted: #aaa;
            --ui-panel-bg: rgba(18, 18, 18, 0.1);
            --ui-border: rgba(255,255,255,0.08);
            --ui-button-bg: rgba(10, 10, 10, 0.1);
            --ui-button-border: rgba(255,255,255,0.12);
            --ui-summary-arrow: #777;
            --ui-text-shadow: none;
            --ui-text-outline: none;
        }
        body.bg-image-loaded {
            --ui-text-shadow: var(--ui-text-outline);
        }
        body { margin: 0; overflow: hidden; background: #111; color: var(--ui-text); font-family: sans-serif; touch-action: none; overscroll-behavior: none; }
        #ui-left, #ui-right { position: absolute; top: 20px; z-index: 10; width: 220px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #555 transparent; touch-action: pan-y; }
        #ui-left { left: 20px; }
        #ui-right { right: 20px; width: 240px; }
        .panel { background: var(--ui-panel-bg); color: var(--ui-text); padding: 15px; border-radius: 8px; border: 1px solid var(--ui-border); box-shadow: 0 4px 20px rgba(0,0,0,0.35); backdrop-filter: blur(10px); text-shadow: var(--ui-text-shadow); }
        
        button { padding: 10px; cursor: pointer; border-radius: 4px; border: 1px solid var(--ui-button-border); background: var(--ui-button-bg); color: var(--ui-text); font-weight: bold; width: 100%; margin-bottom: 5px; transition: 0.2s; text-shadow: var(--ui-text-shadow); }
        button:hover { background: rgba(255,255,255,0.18); }
        #add-model-btn { background: rgba(0,0,0,0.25); color: var(--ui-text); }
        #gen-btn { background: rgba(0,0,0,0.25); }
        #save-pose-btn { background: rgba(0,0,0,0.25); }
        
        details { background: rgba(40, 40, 40, 0.1); border-radius: 4px; margin-top: 5px; border: 1px solid rgba(255,255,255,0.08); }
        summary { padding: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: var(--ui-text); list-style: none; display: flex; justify-content: space-between; align-items: center; text-shadow: var(--ui-text-shadow); }
        summary::after { content: '▼'; font-size: 10px; color: var(--ui-summary-arrow); }
        details[open] summary::after { content: '▲'; }
        
        .control-content { padding: 10px; border-top: 1px solid #333; }
        .control-group { margin-bottom: 12px; }
        .label { font-size: 11px; color: var(--ui-text); margin-bottom: 5px; display: flex; justify-content: space-between; text-shadow: var(--ui-text-shadow); }
        .val { color: var(--ui-text); font-family: monospace; }
        input[type=range] { width: 100%; cursor: pointer; margin: 0; }
        
        .pose-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .pose-item { position: relative; aspect-ratio: 1/1; background: #000; border-radius: 4px; border: 2px solid #444; cursor: pointer; overflow: hidden; }
        .pose-item img { width: 100%; height: 100%; object-fit: cover; }
        .del-pose { position: absolute; top: 2px; right: 2px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; z-index: 5; display:flex; align-items:center; justify-content:center; padding:0; line-height:1; font-size:12px; box-sizing:border-box; }
        
        #status-tip { font-size: 13px; text-align: center; color: #ffc107; margin-bottom: 8px; font-weight: bold; text-shadow: var(--ui-text-shadow);  /* 固定兩行高度的關鍵設定 */
            line-height: 1.4;       /* 設定行高 */
            min-height: 2.8em;      /* 剛好是兩行的高度 (1.4 * 2 = 2.8) */
            display: flex;          /* 使用 flex 讓內容置中 */
            align-items: center;    /* 垂直居中 */
            justify-content: center;/* 水平居中 */
        }
        #ui-left::-webkit-scrollbar { width: 4px; }
        #ui-left::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
        #delete-model-btn { background: rgba(0,0,0,0.25); }
        #undo-btn, #redo-btn { background: rgba(0,0,0,0.25); width: calc(50% - 3px); }
        .btn-row { display: flex; gap: 5px; }
        .model-list-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .model-list-item.active { border-color: #ff4400; background: rgba(255,255,255,0.1); }
        .model-list-item span { color: var(--ui-text); font-size: 11px; text-shadow: var(--ui-text-shadow); }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ui-text); margin-bottom: 10px; text-shadow: var(--ui-text-shadow); }
        .toggle-row label { cursor: pointer; }
        input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: #888888; }
        input[type=color] { width: 100%; height: 32px; border: none; border-radius: 4px; cursor: pointer; background: none; padding: 0; margin-bottom: 10px; }
        #bg-img-btn { background: rgba(0,0,0,0.25); font-size: 12px; padding: 7px; }
        #bg-img-clear { background: rgba(0,0,0,0.25); font-size: 12px; padding: 7px; }

        @media (max-width: 768px) {
            #ui-left, #ui-right { width: 150px; max-height: 60vh; }
            #ui-right { right: 8px; }
            #ui-left { left: 8px; }
            .panel { padding: 8px; }
            button { padding: 12px 6px; font-size: 11px; }
            input[type=range] { height: 22px; }
            input[type=checkbox] { width: 20px; height: 20px; }
            .label, summary, .model-list-item, .toggle-row { font-size: 10px; }
            #status-tip { font-size: 11px; }
        }

        #app-title {
            font-size: 14px;
            font-weight: 900;
            text-align: center;
            color: var(--ui-text);
            letter-spacing: 2px;
            margin-bottom: 4px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* 增加一條淡淡的分隔線 */
            text-shadow: var(--ui-text-shadow);
            opacity: 0.9;
        }

        /* --- 創作者標註樣式 --- */
        .author-link {
            position: fixed;
            bottom: 12px;
            right: 25px;
            z-index: 1000;
            font-size: 11px;
            font-family: sans-serif;
            color: white;
            text-decoration: none;
            opacity: 0.4;
            transition: opacity 0.3s, transform 0.3s;
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.4);
            padding: 5px 10px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
        }
        .author-link:hover {
            opacity: 1;
            color: #FFD700;
            transform: translateY(-2px);
        }

        /* --- 像素小人貼紙動畫 --- */
        .btn-sticker-wrapper {
            position: relative;
            margin-top: 10px;
            overflow: visible !important; 
        }
        .pixel-sticker {
            position: absolute;
            right: 120px; /* 調整小人位置 */
            bottom: calc(100% - 35px); /* 讓小人踩在按鈕上 */
            width: 37px;
            height: 55px; 
            z-index: 999;
            pointer-events: none;
            image-rendering: pixelated;
            transform-origin: bottom center; 
            transition: transform 0.2s;
        }
        .pixel-sticker svg {
            width: 37px;
            height: auto;
            display: block;
            position: absolute;
            bottom: 0;
        }
        .pixel-sticker .frame-group {
            opacity: 0;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
        }

        /* 狀態切換 */
        .pixel-sticker.state-hover { display: none; }
        .btn-sticker-wrapper:hover .pixel-sticker.state-idle { display: none; }
        .btn-sticker-wrapper:hover .pixel-sticker.state-hover { display: block; }
        .btn-sticker-wrapper:hover .pixel-sticker { transform: translateY(-3px); }

        /* 4影格循環動畫 (2.2秒一輪) */
        .playing .f1 { animation: pixel-anim-f1 2.2s steps(1) infinite; }
        .playing .f2 { animation: pixel-anim-f2 2.2s steps(1) infinite; }
        .playing .f3 { animation: pixel-anim-f3 2.2s steps(1) infinite; }
        .playing .f4 { animation: pixel-anim-f4 2.2s steps(1) infinite; }

        @keyframes pixel-anim-f1 { 0%, 25% { opacity: 1; } 25.01%, 100% { opacity: 0; } }
        @keyframes pixel-anim-f2 { 0%, 25% { opacity: 0; } 25.01%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
        @keyframes pixel-anim-f3 { 0%, 50% { opacity: 0; } 50.01%, 75% { opacity: 1; } 75.01%, 100% { opacity: 0; } }
        @keyframes pixel-anim-f4 { 0%, 75% { opacity: 0; } 75.01%, 100% { opacity: 1; } }
    </style>
</head>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    let scene, camera, renderer, orbit, transform, grid, mainLight;
    let composer, outlinePass;
    let selectedModel = null;
    const models = [];
    const savedPoses = [];
    const undoStack = [];
    const redoStack = [];
    const MAX_UNDO = 30;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let randomStrength = 0.5;
    const rand = (min, max) => {
        const factor = randomStrength * 2; // 50% => 1x (原本數值), 100% => 2x, 0% => 0x
        return (min + Math.random() * (max - min)) * factor;
    };

    const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';
    const GIZMO_Y_OFFSET = 2.2; 

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.userData.bgColor = '#111111';
        scene.userData.bgImage = false;
        
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4.5); 

        renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        document.body.appendChild(renderer.domElement);

        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
        outlinePass.edgeStrength = 2.5;
        outlinePass.edgeGlow = 0;
        outlinePass.edgeThickness = 1.5;
        outlinePass.visibleEdgeColor.set(0xffffff);
        outlinePass.hiddenEdgeColor.set(0xffffff);
        composer.addPass(outlinePass);
        composer.addPass(new OutputPass());

        orbit = new OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 1, 0);
        orbit.update();

        transform = new TransformControls(camera, renderer.domElement);
        transform.setSize(0.7);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => {
            orbit.enabled = !e.value;
            if (e.value) {
                pushUndo();
            }
            // 骨骼旋轉結束後保持 rotate 狀態，讓使用者繼續旋轉同一節點
            // 等明確點模型本體或其他節點時才切換
        });

        // 關閉十字軸線輔助顯示
        transform.showX = true;
        transform.showY = true;
        transform.showZ = true;

        grid = new THREE.GridHelper(10, 20, 0x444444, 0x222222);
        scene.add(grid);

        // 地面陰影接收平面（預設隱藏）
        const shadowGeo = new THREE.PlaneGeometry(20, 20);
        const shadowMat = new THREE.ShadowMaterial({ opacity: 0.4 });
        window._shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
        window._shadowPlane.rotation.x = -Math.PI / 2;
        window._shadowPlane.position.y = 0.001;
        window._shadowPlane.receiveShadow = true;
        window._shadowPlane.visible = true;
        scene.add(window._shadowPlane);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(1024, 1024);
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -10;
        mainLight.shadow.camera.right = 10;
        mainLight.shadow.camera.top = 10;
        mainLight.shadow.camera.bottom = -10;
        scene.add(mainLight);
        updateLight();

        function setUIContrast(hexColor) {
            const color = new THREE.Color(hexColor);
            const luminance = 0.2126 * color.r + 0.7152 * color.g + 0.0722 * color.b;
            const isDark = luminance < 0.45;
            const textColor = isDark ? '#f3f3f3' : '#111111';
            const mutedColor = isDark ? '#aaa' : '#555';
            const panelBg = isDark ? 'rgba(18, 18, 18, 0.1)' : 'rgba(255, 255, 255, 0.1)';
            const borderColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.12)';
            const buttonBg = isDark ? 'rgba(10, 10, 10, 0.1)' : 'rgba(255, 255, 255, 0.12)';
            const buttonBorder = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.14)';
            const summaryArrow = isDark ? '#777' : '#444';
            const outlineColor = isDark ? 'rgba(0,0,0,0.95)' : 'rgba(255,255,255,0.95)';
            const outlineShadow = `-1px -1px 0 ${outlineColor}, 1px -1px 0 ${outlineColor}, -1px 1px 0 ${outlineColor}, 1px 1px 0 ${outlineColor}`;

            document.documentElement.style.setProperty('--ui-text', textColor);
            document.documentElement.style.setProperty('--ui-muted', mutedColor);
            document.documentElement.style.setProperty('--ui-panel-bg', panelBg);
            document.documentElement.style.setProperty('--ui-border', borderColor);
            document.documentElement.style.setProperty('--ui-button-bg', buttonBg);
            document.documentElement.style.setProperty('--ui-button-border', buttonBorder);
            document.documentElement.style.setProperty('--ui-summary-arrow', summaryArrow);
            document.documentElement.style.setProperty('--ui-text-outline', outlineShadow);
        }

        // UI 事件綁定
        document.getElementById('add-model-btn').onclick = () => addModel((Math.random()-0.5)*3, true);
        document.getElementById('gen-btn').onclick = randomizePose;
        document.getElementById('rand-strength-slider').oninput = (e) => {
            randomStrength = parseInt(e.target.value, 10) / 100;
            document.getElementById('rand-strength-val').textContent = e.target.value + '%';
        };
        document.getElementById('rand-upper-btn').onclick = () => randomizePart('upper');
        document.getElementById('rand-lower-btn').onclick = () => randomizePart('lower');
        document.getElementById('rand-larm-btn').onclick = () => randomizePart('larm');
        document.getElementById('rand-rarm-btn').onclick = () => randomizePart('rarm');
        document.getElementById('rand-lleg-btn').onclick = () => randomizePart('lleg');
        document.getElementById('rand-rleg-btn').onclick = () => randomizePart('rleg');
        document.getElementById('reset-btn').onclick = resetPose;
        document.getElementById('save-pose-btn').onclick = savePose;
        document.getElementById('export-btn').onclick = exportPose;
        document.getElementById('export-png-btn').onclick = exportPNG;
        document.getElementById('delete-model-btn').onclick = deleteModel;
        document.getElementById('undo-btn').onclick = undo;
        document.getElementById('redo-btn').onclick = redo;

        // 攝影機與光源 UI
        document.getElementById('fov-slider').oninput = (e) => {
            camera.fov = e.target.value;
            camera.updateProjectionMatrix();
            document.getElementById('fov-val').innerText = e.target.value;
        };
        document.getElementById('tilt-slider').oninput = (e) => {
            updateCameraTilt(e.target.value);
            document.getElementById('tilt-val').innerText = e.target.value;
        };

        let lightUIPending = false;
        const onLightUI = () => {
            document.getElementById('l-ang-val').innerText = document.getElementById('l-ang-slider').value;
            document.getElementById('l-h-val').innerText = document.getElementById('l-h-slider').value;
            document.getElementById('l-int-val').innerText = document.getElementById('l-int-slider').value;
            if (!lightUIPending) {
                lightUIPending = true;
                requestAnimationFrame(() => {
                    updateLight();
                    lightUIPending = false;
                });
            }
        };
        document.getElementById('l-ang-slider').oninput = onLightUI;
        document.getElementById('l-h-slider').oninput = onLightUI;
        document.getElementById('l-int-slider').oninput = onLightUI;

        // 背景控制
        document.getElementById('bg-color-picker').oninput = (e) => {
            if (!scene.userData.bgImage) scene.background = new THREE.Color(e.target.value);
            scene.userData.bgColor = e.target.value;
            setUIContrast(e.target.value);
        };
        document.getElementById('grid-toggle').onchange = (e) => {
            grid.visible = e.target.checked;
        };
        document.getElementById('shadow-toggle').onchange = (e) => {
            window._shadowPlane.visible = e.target.checked;
        };
        document.getElementById('bg-img-btn').onclick = () => document.getElementById('bg-img-input').click();
        document.getElementById('bg-img-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = function() {
                scene.userData.bgImageElement = img;
                scene.userData.bgImage = true;
                document.getElementById('bg-img-scale-slider').value = 100;
                document.getElementById('bg-img-scale-val').innerText = '100';
                document.getElementById('bg-img-opacity-slider').value = 100;
                document.getElementById('bg-img-opacity-val').innerText = '100';
                updateBgImageDisplay();
                document.body.classList.add('bg-image-loaded');
                setUIContrast(scene.userData.bgColor || '#111111');
            };
            img.src = url;
        };
        document.getElementById('bg-img-clear').onclick = () => {
            scene.background = new THREE.Color(scene.userData.bgColor || '#111111');
            scene.userData.bgImage = false;
            scene.userData.bgImageElement = null;
            scene.userData.bgTexture = null;
            scene.userData.bgTexRatio = null;
            document.body.classList.remove('bg-image-loaded');
            document.getElementById('bg-img-input').value = '';
            document.getElementById('bg-img-opacity-slider').value = 100;
            document.getElementById('bg-img-opacity-val').innerText = '100';
            document.getElementById('bg-img-scale-slider').value = 100;
            document.getElementById('bg-img-scale-val').innerText = '100';
            setUIContrast(scene.userData.bgColor || '#111111');
        };
        document.getElementById('bg-img-opacity-slider').oninput = (e) => {
            document.getElementById('bg-img-opacity-val').innerText = e.target.value;
            updateBgImageDisplay();
        };
        document.getElementById('bg-img-scale-slider').oninput = (e) => {
            document.getElementById('bg-img-scale-val').innerText = e.target.value;
            updateBgImageDisplay();
        };

        function updateBgImageDisplay() {
            if (!scene.userData.bgImageElement) return;
            const img = scene.userData.bgImageElement;
            const scale = parseFloat(document.getElementById('bg-img-scale-slider').value) / 100;
            const opacity = parseFloat(document.getElementById('bg-img-opacity-slider').value) / 100;

            // 建立 Canvas，比例固定為「圖片本身」的比例（與視窗無關）
            const canvas = document.createElement('canvas');
            const baseRes = 1024;
            const imgRatio = img.width / img.height;
            if (imgRatio >= 1) {
                canvas.width = baseRes;
                canvas.height = Math.round(baseRes / imgRatio);
            } else {
                canvas.height = baseRes;
                canvas.width = Math.round(baseRes * imgRatio);
            }

            const ctx = canvas.getContext('2d');
            ctx.fillStyle = scene.userData.bgColor || '#111111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 依縮放比例繪製圖片（圖片填滿 canvas，再依 scale 縮放並居中）
            const scaledWidth = canvas.width * scale;
            const scaledHeight = canvas.height * scale;
            const x = (canvas.width - scaledWidth) / 2;
            const y = (canvas.height - scaledHeight) / 2;

            ctx.globalAlpha = opacity;
            ctx.drawImage(img, x, y, scaledWidth, scaledHeight);
            ctx.globalAlpha = 1;

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            scene.userData.bgTexture = tex;
            scene.userData.bgTexRatio = canvas.width / canvas.height;
            applyBgCover();
            scene.background = tex;
        }

        // 依視窗比例裁切貼圖（cover），圖片本身比例與大小不變
        function applyBgCover() {
            const tex = scene.userData.bgTexture;
            if (!tex) return;
            const texRatio = scene.userData.bgTexRatio;
            const winRatio = window.innerWidth / window.innerHeight;

            tex.wrapS = THREE.ClampToEdgeWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;

            let repeatX = 1, repeatY = 1;
            if (winRatio > texRatio) {
                // 視窗比圖片寬，裁切上下
                repeatY = texRatio / winRatio;
            } else {
                // 視窗比圖片窄，裁切左右
                repeatX = winRatio / texRatio;
            }
            tex.repeat.set(repeatX, repeatY);
            tex.offset.set((1 - repeatX) / 2, (1 - repeatY) / 2);
            tex.needsUpdate = true;
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('resize', onResize);
        window.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
            if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
        });

        const bgLayer = document.getElementById('bg-layer');
        bgLayer.style.backgroundColor = scene.userData.bgColor || '#111111';
        setUIContrast(scene.userData.bgColor);
        addModel(0, false);
        updateDeleteButtonState();
        animate();
    }

    function updateCameraTilt(val) {
        const angle = val * (Math.PI / 180);
        camera.up.set(Math.sin(angle), Math.cos(angle), 0);
        document.getElementById('tilt-val').innerText = val;
    }

    function updateLight() {
        const ang = document.getElementById('l-ang-slider').value * (Math.PI / 180);
        const elev = document.getElementById('l-h-slider').value * (Math.PI / 180);
        const intensity = parseFloat(document.getElementById('l-int-slider').value);
        const radius = 8;
        const horiz = Math.cos(elev) * radius;
        mainLight.position.set(Math.cos(ang) * horiz, Math.sin(elev) * radius, Math.sin(ang) * horiz);
        mainLight.intensity = intensity;
    }

    function addModel(xPos, randomizeOnAdd = true) {
        document.getElementById('status-tip').innerText = "載入模型中...";
        const loader = new GLTFLoader();
        loader.load(MODEL_URL, (gltf) => {
            pushUndo();
            const m = gltf.scene;
            m.position.set(xPos, 0, 0); 
            scene.add(m);
            
            const moveProxy = new THREE.Group();
            moveProxy.position.copy(m.position);
            moveProxy.position.y += GIZMO_Y_OFFSET;
            scene.add(moveProxy);

            const data = { bones: {}, handles: [], outlines: [], moveProxy: moveProxy };

            m.traverse(n => {
                if (n.isMesh) { n.castShadow = true; }
                if (n.isBone) {
                    data.bones[n.name] = n;
                    const targets = ['Hips', 'Spine', 'Neck', 'Head', 'Arm', 'ForeArm', 'Hand', 'UpLeg', 'Leg', 'Foot'];
                    const excludeBones = ['HeadTop', 'HeadTop_End', 'Head_End', 'HeadEnd', 'Head_Top'];
                    const fingerNames = ['Thumb', 'Index', 'Middle', 'Ring', 'Pinky'];
                    if (targets.some(t => n.name.includes(t)) && !fingerNames.some(f => n.name.includes(f)) && !excludeBones.some(ex => n.name.includes(ex))) {
                        const h = new THREE.Mesh(
                            new THREE.SphereGeometry(n.name.includes('Hips') ? 0.06 : 0.04),
                            new THREE.MeshBasicMaterial({ color: n.name.includes('Hips') ? 0xff4400 : 0x00ff88, depthTest: false, transparent: true, opacity: n.name.includes('Hips') ? 0.85 : 0.5 })
                        );
                        h.userData.bone = n;
                        h.visible = false;
                        // 隱形較大的碰撞球，提升手機觸控點擊命中率
                        const hitProxy = new THREE.Mesh(
                            new THREE.SphereGeometry(n.name.includes('Hips') ? 0.12 : 0.09),
                            new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthTest: false, depthWrite: false })
                        );
                        h.add(hitProxy);
                        h.userData.hitProxy = hitProxy;
                        scene.add(h);
                        data.handles.push(h);
                    }
                }
                if (n.isMesh) {
                    const wireframe = new THREE.LineSegments(
                        new THREE.WireframeGeometry(n.geometry),
                        new THREE.LineBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.3 })
                    );
                    wireframe.visible = false;
                    n.add(wireframe);
                    data.outlines.push(wireframe);
                }
            });
            m.userData = data;
            storeOriginalMaterialColors(m);
            setModelColor(m, '#888888');
            models.push(m);
            selectModel(m, models.length > 1);
            transform.setMode('translate');
            transform.attach(moveProxy);
            if (randomizeOnAdd && models.length > 1) randomizePose(false);
            document.getElementById('status-tip').innerText = "模型就緒";
            updateDeleteButtonState();
        });
    }

    function selectModel(m, showOutline = true) {
        models.forEach(model => {
            model.userData.handles.forEach(h => h.visible = false);
            model.userData.outlines.forEach(o => o.visible = false);
        });
        selectedModel = m;
        if (m) {
            m.userData.outlines.forEach(o => o.visible = showOutline);
            outlinePass.selectedObjects = showOutline ? [m] : [];
            document.getElementById('status-tip').innerText = showOutline ? "已選中模型（再點一下顯示節點）" : "已選中模型";
        } else {
            transform.detach();
            outlinePass.selectedObjects = [];
            document.getElementById('status-tip').innerText = "點擊模型編輯";
        }
        renderModelList();
    }

    function showHandles(m) {
        if (!m) return;
        m.userData.handles.forEach(h => h.visible = true);
        document.getElementById('status-tip').innerText = "已顯示節點";
    }

    let pointerDownPos = null;
    let pointerDownCount = 0;

    function onPointerDown(e) {
        if (e.target.closest('#ui-left') || e.target.closest('#ui-right')) return;
        pointerDownCount++;
        pointerDownPos = { x: e.clientX, y: e.clientY };
    }

    function onPointerUp(e) {
        if (e.target.closest('#ui-left') || e.target.closest('#ui-right')) { pointerDownCount = 0; pointerDownPos = null; return; }
        pointerDownCount = Math.max(0, pointerDownCount - 1);
        if (!pointerDownPos) return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        pointerDownPos = null;
        // 多指操作（縮放/平移視角）或拖曳幅度過大時，不視為點擊選取
        if (pointerDownCount > 0 || dist > 10) return;
        if (transform.dragging) return;

        handleSelectClick(e.clientX, e.clientY);
    }

    function handleSelectClick(clientX, clientY) {
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        // 優先判定：是否點到骨骼節點（使用較大的隱形碰撞球，方便觸控）
        if (selectedModel) {
            const visibleHandles = selectedModel.userData.handles.filter(h => h.visible);
            const hitProxies = visibleHandles.map(h => h.userData.hitProxy);
            const hitH = raycaster.intersectObjects(hitProxies)[0];
            if (hitH) {
                transform.detach();
                transform.setMode('rotate');
                transform.attach(hitH.object.parent.userData.bone);
                return; // 完全攔截，不往下走
            }
        }

        // 沒點到節點：切回 translate，再判定是否點到模型本體
        transform.detach();
        transform.setMode('translate');

        let hitModel = null;
        for (const m of models) {
            if (!m.visible) continue;
            if (raycaster.intersectObject(m, true)[0]) { hitModel = m; break; }
        }

        if (hitModel) {
            if (hitModel === selectedModel && !hitModel.userData.handles[0]?.visible) {
                showHandles(hitModel);
                transform.attach(hitModel.userData.moveProxy);
            } else if (hitModel === selectedModel) {
                transform.attach(hitModel.userData.moveProxy);
            } else {
                selectModel(hitModel);
                transform.attach(hitModel.userData.moveProxy);
            }
        } else {
            if (models.length === 1) {
                models[0].userData.handles.forEach(h => h.visible = false);
            } else {
                selectModel(null);
            }
        }
    }

    function randomizePart(part, saveUndo = true) {
        if (!selectedModel) return;
        if (saveUndo) pushUndo();
        const b = selectedModel.userData.bones;
        const randLArm = () => {
            // Z軸基礎為 -1.5 (垂直向下)
            // 當強度 50% (factor=1) 時，rand(-0.5, 1.5) 會讓手在 -2.0 到 0.0 (水平) 之間擺動
            // 當強度 100% (factor=2) 時，範圍變成 -2.5 到 1.5，手就能舉過頭了
            if(b.mixamorigLeftArm) b.mixamorigLeftArm.rotation.set(rand(-0.8, 0.8), rand(-0.5, 0.5), -1.2 + rand(-0.5, 1.6));
            if(b.mixamorigLeftForeArm) b.mixamorigLeftForeArm.rotation.set(rand(-0.4, 0.4), rand(-0.0, -2.0), rand(-0.4, 0.4));
            if(b.mixamorigLeftHand) b.mixamorigLeftHand.rotation.set(rand(-0.4, 0.4), rand(-0.4, 0.4), rand(-0.4, 0.4));
        };

        const randRArm = () => {
            // Z軸基礎為 1.5 (垂直向下)
            if(b.mixamorigRightArm) b.mixamorigRightArm.rotation.set(rand(-0.8, 0.8), rand(-0.5, 0.5), 1.2 + rand(-1.6, 0.5));
            if(b.mixamorigRightForeArm) b.mixamorigRightForeArm.rotation.set(rand(-0.4, 0.4), rand(2.0, -0.0), rand(-0.4, 0.4));
            if(b.mixamorigRightHand) b.mixamorigRightHand.rotation.set(rand(-0.4, 0.4), rand(-0.4, 0.4), rand(-0.4, 0.4));
        };
        const randLLeg = () => {
            if(b.mixamorigLeftUpLeg) b.mixamorigLeftUpLeg.rotation.set(rand(-2.8, 0.2), 0, rand(-0.6, 0.2));
            if(b.mixamorigLeftLeg) b.mixamorigLeftLeg.rotation.x = rand(0, 2.8);
            if(b.mixamorigLeftFoot) b.mixamorigLeftFoot.rotation.x = rand(-0.5, 0.5);
        };
        const randRLeg = () => {
            if(b.mixamorigRightUpLeg) b.mixamorigRightUpLeg.rotation.set(rand(-2.8, 0.2), 0, rand(-0.6, 0.2));
            if(b.mixamorigRightLeg) b.mixamorigRightLeg.rotation.x = rand(0, 2.8);
            if(b.mixamorigRightFoot) b.mixamorigRightFoot.rotation.x = rand(-0.5, 0.5);
        };

        if (part === 'upper' || part === 'all') {
            if(b.mixamorigSpine1) b.mixamorigSpine1.rotation.set(rand(-0.6, 0.8), rand(-0.8, 0.8), rand(-0.8, 0.8));
            if(b.mixamorigNeck) b.mixamorigNeck.rotation.set(rand(-0.5, 0.5), rand(-0.8, 0.8), rand(-0.3, 0.3));
            if(b.mixamorigHead) b.mixamorigHead.rotation.set(rand(-0.3, 0.3), rand(-0.5, 0.5), rand(-0.2, 0.2));
            randLArm(); randRArm();
        }
        if (part === 'lower' || part === 'all') { randLLeg(); randRLeg(); 
            if(b.mixamorigHips) b.mixamorigHips.rotation.set(rand(-0.2, 0.2), rand(-0.4, 0.4), rand(-0.8, 0.8));
            if(b.mixamorigSpine) b.mixamorigSpine.rotation.set(rand(-0.7, 0.7), rand(-0.8, 0.8), rand(-0.8, 0.8));
        }
        if (part === 'larm') randLArm();
        if (part === 'rarm') randRArm();
        if (part === 'lleg') randLLeg();
        if (part === 'rleg') randRLeg();
    }
    function randomizePose(saveUndo = true) {
        if (!selectedModel) return;
        randomizePart('upper', saveUndo);
        randomizePart('lower', false);
    }

    function resetPose() {
        if (!selectedModel) return;
        pushUndo();
        selectedModel.traverse(n => {
            if (n.isBone) {
                n.rotation.set(0,0,0);
            }
        });
    }

    function savePose() {
        const old = selectedModel;
        selectModel(null);
        grid.visible = false;
        renderer.render(scene, camera);
        const thumb = renderer.domElement.toDataURL('image/jpeg', 0.5);
        
        const snapshotModels = models.map(m => {
            const bData = {};
            m.traverse(n => { if(n.isBone) bData[n.name] = { rot: n.rotation.clone(), pos: n.position.clone() }; });
            return { pos: m.position.clone(), bones: bData };
        });

        const sceneData = {
            camera: { pos: camera.position.clone(), target: orbit.target.clone(), fov: camera.fov, tilt: document.getElementById('tilt-slider').value },
            light: { ang: document.getElementById('l-ang-slider').value, h: document.getElementById('l-h-slider').value, int: document.getElementById('l-int-slider').value }
        };

        savedPoses.push({ thumb, snapshotModels, sceneData });
        grid.visible = true;
        if(old) selectModel(old);
        renderList();
    }

    function renderList() {
        const container = document.getElementById('pose-list');
        container.innerHTML = '';
        savedPoses.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'pose-item';
            div.innerHTML = `<img src="${p.thumb}"><button class="del-pose">×</button>`;
            div.onclick = () => {
                // 還原模型
                models.forEach((model, idx) => {
                    const data = p.snapshotModels[idx];
                    if (data) {
                        model.visible = true;
                        model.userData.moveProxy.visible = true;
                        model.position.copy(data.pos);
                        model.userData.moveProxy.position.copy(data.pos).y += GIZMO_Y_OFFSET;
                        model.traverse(n => { if(n.isBone && data.bones[n.name]) { n.rotation.copy(data.bones[n.name].rot); n.position.copy(data.bones[n.name].pos); } });
                    } else {
                        model.visible = false;
                        model.userData.moveProxy.visible = false;
                    }
                });
                // 還原環境
                const c = p.sceneData.camera;
                camera.position.copy(c.pos); orbit.target.copy(c.target);
                camera.fov = c.fov; camera.updateProjectionMatrix();
                document.getElementById('fov-slider').value = c.fov;
                document.getElementById('fov-val').innerText = c.fov;
                document.getElementById('tilt-slider').value = c.tilt;
                updateCameraTilt(c.tilt);

                const l = p.sceneData.light;
                document.getElementById('l-ang-slider').value = l.ang;
                document.getElementById('l-h-slider').value = l.h;
                document.getElementById('l-int-slider').value = l.int;
                document.getElementById('l-ang-val').innerText = l.ang;
                document.getElementById('l-h-val').innerText = l.h;
                document.getElementById('l-int-val').innerText = l.int;
                updateLight();
                orbit.update();
            };
            div.querySelector('.del-pose').onclick = (e) => { e.stopPropagation(); savedPoses.splice(i,1); renderList(); };
            container.appendChild(div);
        });
    }

    function exportPNG() {
        const oldSelected = outlinePass.selectedObjects;
        const hiddenStates = models.map(m => ({
            handles: m.userData.handles.map(h => h.visible),
            outlines: m.userData.outlines.map(o => o.visible)
        }));
        models.forEach(m => {
            m.userData.handles.forEach(h => h.visible = false);
            m.userData.outlines.forEach(o => o.visible = false);
        });
        outlinePass.selectedObjects = [];
        composer.render();
        const dataURL = renderer.domElement.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = dataURL;
        link.download = 'pose.png';
        link.click();
        models.forEach((m, i) => {
            m.userData.handles.forEach((h, j) => h.visible = hiddenStates[i].handles[j]);
            m.userData.outlines.forEach((o, j) => o.visible = hiddenStates[i].outlines[j]);
        });
        outlinePass.selectedObjects = oldSelected;
    }

    function exportPose() {
        if (!selectedModel) return;
        const exporter = new GLTFExporter();
        const oldHandles = selectedModel.userData.handles.map(h => h.visible);
        const oldOutlines = selectedModel.userData.outlines.map(o => o.visible);
        selectedModel.userData.handles.forEach(h => h.visible = false);
        selectedModel.userData.outlines.forEach(o => o.visible = false);
        exporter.parse(selectedModel, (result) => {
            const blob = new Blob([result], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'pose.glb';
            link.click();
            selectedModel.userData.handles.forEach((h, i) => h.visible = oldHandles[i]);
            selectedModel.userData.outlines.forEach((o, i) => o.visible = oldOutlines[i]);
        }, (err) => { console.error(err); }, { binary: true, trs: true });
    }

    // ── 復原/重做 ──────────────────────────────────────────
    // snapshot 儲存每個模型的完整參考（含 scene object）+ 骨骼狀態
    function captureState() {
        return {
            selectedIndex: selectedModel ? models.indexOf(selectedModel) : -1,
            models: models.map(m => {
                const bData = {};
                m.traverse(n => { if(n.isBone) bData[n.name] = { rot: n.rotation.clone(), pos: n.position.clone() }; });
                return { ref: m, pos: m.position.clone(), visible: m.visible, bones: bData };
            })
        };
    }

    function updateDeleteButtonState() {
        const btn = document.getElementById('delete-model-btn');
        btn.disabled = models.length <= 1;
    }

    function applyState(state) {
        // 先把目前 scene 裡的模型全部移除
        const currentModels = [...models];
        currentModels.forEach(m => {
            scene.remove(m);
            scene.remove(m.userData.moveProxy);
            m.userData.handles.forEach(h => scene.remove(h));
        });
        models.length = 0;

        // 依快照把模型加回來
        state.models.forEach(data => {
            const m = data.ref;
            scene.add(m);
            scene.add(m.userData.moveProxy);
            m.userData.handles.forEach(h => scene.add(h));
            m.visible = data.visible;
            m.userData.moveProxy.visible = data.visible;
            m.position.copy(data.pos);
            m.userData.moveProxy.position.copy(data.pos);
            m.userData.moveProxy.position.y += GIZMO_Y_OFFSET;
            m.traverse(n => { if(n.isBone && data.bones[n.name]) { n.rotation.copy(data.bones[n.name].rot); n.position.copy(data.bones[n.name].pos); } });
            models.push(m);
        });

        if (state.selectedIndex >= 0 && state.selectedIndex < models.length) {
            selectModel(models[state.selectedIndex]);
        } else {
            selectModel(null);
        }
        renderModelList();
        updateDeleteButtonState();
    }

    function pushUndo() {
        undoStack.push(captureState());
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack.length = 0;
    }

    function undo() {
        if (!undoStack.length) return;
        redoStack.push(captureState());
        applyState(undoStack.pop());
    }

    function redo() {
        if (!redoStack.length) return;
        undoStack.push(captureState());
        applyState(redoStack.pop());
    }

    // ── 刪除模型 ───────────────────────────────────────────
    function deleteModel() {
        if (models.length <= 1) {
            document.getElementById('status-tip').innerText = "至少需保留一個模型";
            return;
        }
        if (!selectedModel) return;
        pushUndo();
        const m = selectedModel;
        selectModel(null);
        m.userData.handles.forEach(h => scene.remove(h));
        scene.remove(m.userData.moveProxy);
        scene.remove(m);
        const idx = models.indexOf(m);
        if (idx !== -1) models.splice(idx, 1);
        if (models.length === 1) {
            selectModel(models[0], false);
            transform.setMode('translate');
            transform.attach(models[0].userData.moveProxy);
        }
        renderModelList();
        updateDeleteButtonState();
    }

    // ── 模型顏色 ───────────────────────────────────────────
    function setModelColor(m, hex) {
        m.userData.color = hex;
        const overlay = new THREE.Color(hex);
        const overlayHSL = { h: 0, s: 0, l: 0 };
        overlay.getHSL(overlayHSL);

        m.traverse(n => {
            if (n.isMesh && n.material) {
                const materials = Array.isArray(n.material) ? n.material : [n.material];
                materials.forEach(mat => {
                    if (!mat.userData) mat.userData = {};
                    if (mat.color) {
                        if (!mat.userData.originalColor) mat.userData.originalColor = mat.color.clone();
                        const baseColor = mat.userData.originalColor.clone();
                        const baseHSL = { h: 0, s: 0, l: 0 };
                        baseColor.getHSL(baseHSL);
                        // 只改變色相與飽和度，保留原始亮度深淺
                        mat.color.setHSL(overlayHSL.h, overlayHSL.s, baseHSL.l);
                    }
                    if ('emissive' in mat && mat.emissive && mat.userData.originalEmissive) {
                        mat.emissive.copy(mat.userData.originalEmissive);
                        mat.emissiveIntensity = mat.userData.originalEmissiveIntensity ?? mat.emissiveIntensity;
                    }
                    if ('metalness' in mat && mat.userData.originalMetalness !== undefined) mat.metalness = mat.userData.originalMetalness;
                    if ('roughness' in mat && mat.userData.originalRoughness !== undefined) mat.roughness = mat.userData.originalRoughness;
                    if ('flatShading' in mat && mat.userData.originalFlatShading !== undefined) mat.flatShading = mat.userData.originalFlatShading;
                    if ('transparent' in mat) mat.transparent = mat.userData.originalTransparent ?? mat.transparent;
                    if ('opacity' in mat) mat.opacity = mat.userData.originalOpacity ?? mat.opacity;
                    mat.needsUpdate = true;
                });
            }
        });
    }

    function storeOriginalMaterialColors(m) {
        m.traverse(n => {
            if (n.isMesh && n.material) {
                const materials = Array.isArray(n.material) ? n.material : [n.material];
                materials.forEach(mat => {
                    mat.userData = mat.userData || {};
                    if (mat.color) mat.userData.originalColor = mat.color.clone();
                    if ('emissive' in mat && mat.emissive) mat.userData.originalEmissive = mat.emissive.clone();
                    if ('emissiveIntensity' in mat) mat.userData.originalEmissiveIntensity = mat.emissiveIntensity;
                    if ('metalness' in mat) mat.userData.originalMetalness = mat.metalness;
                    if ('roughness' in mat) mat.userData.originalRoughness = mat.roughness;
                    if ('flatShading' in mat) mat.userData.originalFlatShading = mat.flatShading;
                    if ('transparent' in mat) mat.userData.originalTransparent = mat.transparent;
                    if ('opacity' in mat) mat.userData.originalOpacity = mat.opacity;
                });
            }
        });
    }

    // ── 模型列表 ───────────────────────────────────────────
    function renderModelList() {
        const container = document.getElementById('model-list');
        container.innerHTML = '';
        if (!models.length) {
            container.innerHTML = '<div style="color:#666;font-size:12px;text-align:center">無模型</div>';
            return;
        }
        models.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'model-list-item' + (m === selectedModel ? ' active' : '');
            const currentColor = m.userData.color || '#ffffff';
            div.innerHTML = `<span>人偶 ${i + 1}</span><span style="display:flex;align-items:center;gap:4px;"><input class="color-btn" type="color" value="${currentColor}" style="width:22px;height:22px;border:none;border-radius:3px;cursor:pointer;padding:0;background:none;" title="改色"><span class="eye-btn" style="cursor:pointer;font-size:15px;padding:2px 3px;">${m.visible ? '👁' : '🚫'}</span></span>`;
            div.onclick = () => {
                selectModel(m);
                transform.setMode('translate');
                transform.attach(m.userData.moveProxy);
                renderModelList();
            };
            div.querySelector('.color-btn').oninput = (e) => {
                e.stopPropagation();
                setModelColor(m, e.target.value);
            };
            div.querySelector('.color-btn').onclick = (e) => e.stopPropagation();
            div.querySelector('.eye-btn').onclick = (e) => {
                e.stopPropagation();
                pushUndo();
                m.visible = !m.visible;
                m.userData.moveProxy.visible = m.visible;
                const isSel = m.visible && m === selectedModel;
                m.userData.outlines.forEach(o => o.visible = isSel);
                m.userData.handles.forEach(h => h.visible = false);
                renderModelList();
            };
            container.appendChild(div);
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        models.forEach(m => {
            if (transform.mode === 'translate' && transform.object === m.userData.moveProxy) {
                m.position.x = m.userData.moveProxy.position.x;
                m.position.y = m.userData.moveProxy.position.y - GIZMO_Y_OFFSET;
                m.position.z = m.userData.moveProxy.position.z;
            } else {
                m.userData.moveProxy.position.copy(m.position);
                m.userData.moveProxy.position.y += GIZMO_Y_OFFSET;
            }
            if (m === selectedModel) {
                m.userData.handles.forEach(h => {
                    const wp = new THREE.Vector3();
                    h.userData.bone.getWorldPosition(wp);
                    h.position.copy(wp);
                });
            }
        });
        composer.render();
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        if (scene.userData.bgImage) applyBgCover();
    }
</script>
